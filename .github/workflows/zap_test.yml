name: Deploy Provider Portal

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "Sandbox"
        type: choice
        options:
          - Sandbox
          - Development
          - QA
          - Production

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VITE_APP_MSAL_REDIRECT_URI: ${{ vars.MSAL_REDIRECT_URI }}
      VITE_HRA_SERVICE_API_URL: ${{ vars.HRA_SERVICE_API_URL }}

    steps:
    - name: ZAP Scan
      id: zap_scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'https://provider.helloporter.com/'
        token: ${{ secrets.GITHUB_TOKEN }}

